[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/question-bank.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
